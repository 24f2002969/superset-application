{% extends "company/base.html" %}

{% block content %}

<div class="modal-overlay">
  <div class="modal-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="margin-bottom: 1rem;">
          {% for category, message in messages %}
            <div class="flash-msg flash-{{ category }} alert-dismissible fade show" role="alert">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <h2>Edit Profile</h2>

    <form method="POST" action="{{ url_for('company.edit_profile') }}">

      <div class="mb-3">
        <label>Company Name</label>
        <input type="text" name="name" value="{{ company.name }}" class="custom-input w-100" required>
      </div>

      <div class="mb-3">
        <label>Website</label>
        <input type="text" name="website" value="{{ company.website }}" class="custom-input w-100" required>
      </div>

      <div class="mb-3">
        <label>HR Contact</label>
        <input type="text" name="hr_contact" value="{{ company.hr_contact }}" class="custom-input w-100" required>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <a href="{{ url_for('company.profile') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-success">Save Changes</button>
      </div>

    </form>

  </div>
</div>

{% endblock %}
