{% extends "company/base.html" %}

{% block content %}

<div class="modal-overlay">
  <div class="modal-card">
    <div class="d-flex justify-content-between align-items-center">
      <h2>Company Profile</h2>
      <h2>ID #{{ company.id }}</h2>
    </div>

    <div class="mb-3">
      <label class="text-muted">Company Name</label>
      <div>{{ company.name }}</div>
    </div>

    <div class="mb-3">
      <label class="text-muted">Website</label>
      <div>{{ company.website }}</div>
    </div>

    <div class="mb-3">
      <label class="text-muted">HR Contact</label>
      <div>{{ company.hr_contact }}</div>
    </div>

    <div class="mb-3">
      <label class="text-muted">Approval Status</label>
      <div>
        <span class="badge 
          {% if company.is_approved == 'approved' %}bg-success
          {% elif company.is_approved == 'pending' %}bg-warning text-dark
          {% else %}bg-danger{% endif %}">
          {{ company.is_approved | capitalize }}
        </span>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <a href="{{ url_for('company.dashboard') }}" class="btn btn-secondary">Cancel</a>
      <a href="{{ url_for('company.edit_profile') }}" class="btn btn-warning">Edit Profile</a>
    </div>

  </div>
</div>

{% endblock %}
