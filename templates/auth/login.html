{% extends "auth/base.html" %}

{% block title %}Login — SuperSet{% endblock %}

{% block content %}
<h2 class="auth-heading">Welcome back</h2>
<p class="auth-sub">Sign in to your account to continue</p>

<form method="POST" action="{{ url_for('auth.login') }}">

  <div class="auth-field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username"
           class="custom-input" placeholder="Enter your username" required>
  </div>

  <div class="auth-field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           class="custom-input" placeholder="Enter your password" required>
  </div>

  <button type="submit" class="btn-auth">Sign In</button>

</form>
{% endblock %}

{% block auth_footer %}
<div class="auth-footer">
  Don't have an account? <a href="{{ url_for('auth.register_student') }}">Register here</a>
</div>
{% endblock %}
